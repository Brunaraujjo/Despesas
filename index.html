<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Livro-Caixa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1C2624;
    --paper:#F3F5F2;
    --card:#FFFFFF;
    --line:#DDE3DD;
    --primary:#2F5D50;
    --primary-dark:#1F4038;
    --amber:#B8842E;
    --amber-bg:#FBF1DF;
    --coral:#B5493A;
    --coral-bg:#FBEAE6;
    --muted:#6B7A73;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  body{padding-bottom:84px; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; font-weight:600;}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  /* HEADER */
  header{background:var(--primary-dark); color:#F3F5F2; padding:18px 16px 22px; position:sticky; top:0; z-index:20; box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .brand{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .brand-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:.2px;}
  .brand-mark{width:26px; height:26px; border-radius:6px; margin-right:8px; object-fit:cover; display:inline-block; vertical-align:middle;}
  .month-nav{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .month-nav button{background:rgba(255,255,255,.12); border:none; color:#F3F5F2; width:38px; height:38px; border-radius:10px; font-size:18px; display:flex; align-items:center; justify-content:center;}
  .month-nav button:active{background:rgba(255,255,255,.22);}
  .month-label{flex:1; text-align:center;}
  .month-label .m{font-family:'Fraunces',serif; font-size:20px; font-weight:600; text-transform:capitalize;}
  .month-label .today-link{display:block; font-size:11px; color:var(--amber); margin-top:2px; opacity:.9;}

  /* LEDGER STRIP (signature element) */
  .ledger{margin:14px 16px 0; background:var(--card); border-radius:var(--radius); padding:14px 14px 10px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .ledger-row{display:flex; align-items:center; gap:6px;}
  .ledger-seg{flex:1; text-align:center; padding:4px 2px;}
  .ledger-seg .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:3px;}
  .ledger-seg .val{font-size:14.5px; font-weight:600;}
  .ledger-arrow{color:var(--line); font-size:14px;}
  .ledger-track{height:6px; border-radius:4px; background:var(--line); margin:12px 0 6px; overflow:hidden; display:flex;}
  .ledger-track .seg-in{background:var(--primary); height:100%;}
  .ledger-track .seg-out{background:var(--coral); height:100%;}
  .balance-final{text-align:center; padding-top:8px; border-top:1px dashed var(--line); margin-top:4px;}
  .balance-final .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .balance-final .val{font-family:'Fraunces',serif; font-size:26px; font-weight:700; margin-top:2px;}
  .val.pos{color:var(--primary-dark);}
  .val.neg{color:var(--coral);}
  .opening-edit{font-size:11.5px; color:var(--amber); text-align:center; margin-top:8px; text-decoration:underline; opacity:.9;}

  /* TABS */
  .tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:8px 2px; border-radius:10px; color:var(--muted); font-size:10.5px; font-weight:600;}
  .tab .ic{font-size:18px;}
  .tab.active{color:var(--primary-dark);}
  .tab.active .ic{transform:scale(1.05);}

  /* CONTENT */
  main{padding:16px; max-width:640px; margin:0 auto;}
  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin:18px 0 10px;}
  .section-title h2{font-size:16px;}
  .section-title .total{font-size:14px; font-weight:600; color:var(--muted);}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.05); overflow:hidden;}
  .empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:13.5px;}
  .empty b{display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px; font-family:'Fraunces',serif;}

  .day-group{border-bottom:1px solid var(--line);}
  .day-group:last-child{border-bottom:none;}
  .day-head{display:flex; justify-content:space-between; padding:9px 14px; background:#FAFBF9; font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .item-row{display:flex; align-items:center; justify-content:space-between; padding:11px 14px; gap:10px; border-top:1px solid var(--line);}
  .day-group .item-row:first-of-type{border-top:none;}
  .item-desc{font-size:14px; flex:1; min-width:0;}
  .item-desc .plat{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .item-value{font-weight:600; font-size:14.5px; white-space:nowrap;}
  .item-del{background:none; border:none; color:var(--coral); font-size:17px; padding:2px 6px; opacity:.55;}
  .item-del:active{opacity:1;}

  .platform-tag{display:inline-block; background:var(--amber-bg); color:var(--amber); font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; margin-top:6px;}

  /* ADD FORM (floating sheet) */
  .fab{position:fixed; right:18px; bottom:78px; width:54px; height:54px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:26px; box-shadow:0 4px 14px rgba(31,64,56,.35); z-index:25; display:flex; align-items:center; justify-content:center;}
  .fab:active{background:var(--primary-dark);}
  .sheet-overlay{position:fixed; inset:0; background:rgba(20,30,26,.42); z-index:40; display:flex; align-items:flex-end;}
  .sheet{background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto;}
  .sheet h3{font-size:17px; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input,.field select{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; background:#FCFCFB;}
  .field input:focus,.field select:focus{outline:none; border-color:var(--primary);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:13px; border-radius:11px; border:none; font-weight:700; font-size:14.5px;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-ghost{background:#F0F1EE; color:var(--muted);}
  .toggle-row{display:flex; gap:8px; margin-bottom:12px;}
  .toggle-opt{flex:1; padding:9px; text-align:center; border-radius:9px; background:#F0F1EE; color:var(--muted); font-size:12.5px; font-weight:700; border:1.5px solid transparent;}
  .toggle-opt.on{background:var(--primary); color:#fff;}

  .status-pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .status-pill.pago{background:var(--primary); color:#fff;}
  .status-pill.pendente{background:var(--coral-bg); color:var(--coral);}

  .auth-overlay{position:fixed; inset:0; background:var(--paper); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-box{width:100%; max-width:360px;}
  .auth-box .brand-row{display:flex; align-items:center; gap:10px; margin-bottom:22px; justify-content:center;}
  .auth-box h1{font-size:22px;}
  .auth-tabs{display:flex; gap:8px; margin-bottom:18px;}
  .auth-tab{flex:1; text-align:center; padding:10px; border-radius:10px; background:#EAEDE9; color:var(--muted); font-weight:700; font-size:13.5px;}
  .auth-tab.on{background:var(--primary-dark); color:#fff;}
  .auth-error{background:var(--coral-bg); color:var(--coral); font-size:12.5px; padding:9px 12px; border-radius:9px; margin-bottom:12px; display:none;}
  .auth-error.show{display:block;}
  .header-right{display:flex; align-items:center; gap:10px;}
  .logout-btn{background:rgba(255,255,255,.12); border:none; color:#F3F5F2; font-size:11px; padding:6px 10px; border-radius:8px; font-weight:600;}
  .loading{padding:40px; text-align:center; color:var(--muted);}
  .toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s;}
  .toast.show{opacity:1;}

  /* PLANEJAMENTO (ciclo financeiro) */
  .pl-header{margin-bottom:6px;}
  .pl-header h2{font-size:19px;}
  .pl-header .sub{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .pl-section{background:var(--card); border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.05); padding:16px 16px 12px; margin-bottom:16px;}
  .pl-section h3{font-size:14.5px; display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .pl-section h3 .tag{font-family:'Inter',sans-serif; font-size:10px; background:var(--primary-dark); color:#fff; padding:2px 6px; border-radius:4px; font-weight:700;}
  .pl-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .pl-row:last-child{border-bottom:none;}
  .pl-row .pl-label{flex:1; min-width:0;}
  .pl-row input[type="text"]{border:none; background:transparent; font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink); width:100%; padding:2px 0;}
  .pl-row input[type="text"]:focus{outline:1px solid var(--primary); outline-offset:2px; border-radius:3px;}
  .pl-row input[type="number"]{width:96px; text-align:right; border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; background:#FCFCFB;}
  .pl-row input[type="number"]:focus{outline:none; border-color:var(--primary);}
  .pl-del{background:none; border:none; color:var(--muted); font-size:16px; padding:2px 4px; opacity:.6;}
  .pl-del:active{opacity:1; color:var(--coral);}
  .pl-add-row{margin-top:8px; width:100%; background:none; border:1.5px dashed var(--line); border-radius:9px; color:var(--primary); font-size:12.5px; padding:8px 10px;}
  .pl-subtotal{display:flex; justify-content:space-between; margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); font-weight:600; font-size:13.5px;}
  .pl-debt-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);}
  .pl-debt-row:last-child{border-bottom:none;}
  .pl-debt-row input[type="checkbox"]{width:17px; height:17px; accent-color:var(--primary-dark);}
  .pl-debt-name{flex:1; min-width:0; font-size:13.5px;}
  .pl-debt-status{font-family:'Inter',sans-serif; font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:20px; margin-top:3px; display:inline-block;}
  .pl-status-negativada{background:var(--coral-bg); color:var(--coral);}
  .pl-status-atrasada{background:var(--amber-bg); color:var(--amber);}
  .pl-status-negociar{background:#EAEDE9; color:var(--muted);}
  .pl-debt-row input[type="number"]{width:96px; text-align:right; border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; background:#FCFCFB;}
  .pl-summary{background:var(--primary-dark); color:#F3F5F2;}
  .pl-summary h3{color:#F3F5F2;}
  .pl-summary h3 .tag{background:var(--amber); color:var(--primary-dark);}
  .pl-summary .pl-row{border-bottom:1px solid rgba(243,245,242,.15);}
  .pl-final-balance{margin-top:10px; padding-top:12px; border-top:1px solid rgba(243,245,242,.3); display:flex; justify-content:space-between; align-items:baseline;}
  .pl-final-balance .lbl{font-family:'Fraunces',serif; font-size:15px;}
  .pl-final-balance .val{font-size:24px; font-weight:700;}
  .pl-final-balance .val.positive{color:#9FD6B8;}
  .pl-final-balance .val.negative{color:#F0A08A;}
  .pl-note{font-size:11.5px; color:rgba(243,245,242,.65); margin-top:8px; line-height:1.5;}
  .pl-footer-note{text-align:center; font-size:11.5px; color:var(--muted); margin-top:18px; line-height:1.6;}

  /* INVESTIMENTOS */
  .inv-summary{background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:18px;}
  .inv-summary-row{display:flex; justify-content:space-between; align-items:baseline;}
  .inv-summary .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .inv-summary .val{font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--primary-dark); margin-top:2px;}
  .inv-summary .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .inv-summary-split{display:flex; gap:10px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
  .inv-summary-split .item{flex:1; text-align:center;}
  .inv-summary-split .item .n{font-size:15px; font-weight:700;}
  .inv-summary-split .item .l{font-size:10.5px; color:var(--muted); margin-top:2px;}
  .inv-row{padding:14px; border-top:1px solid var(--line); position:relative;}
  .inv-row:first-child{border-top:none;}
  .inv-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .inv-name{font-size:14.5px; font-weight:600;}
  .inv-broker{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .inv-value{font-family:'Fraunces',serif; font-size:16.5px; font-weight:700; color:var(--primary-dark); white-space:nowrap;}
  .inv-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;}
  .tag{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .tag-rate{background:var(--amber-bg); color:var(--amber);}
  .tag-term{background:#EAEDE9; color:var(--muted);}
  .tag-project{background:#E4EEEA; color:var(--primary-dark);}
  .inv-note{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.4;}
  .inv-del{position:absolute; top:12px; right:12px; background:none; border:none; color:var(--coral); font-size:17px; padding:2px 6px; opacity:.55;}
  .inv-del:active{opacity:1;}
  .inv-edit{background:none; border:none; color:var(--muted); font-size:14px; padding:2px 6px; opacity:.55;}
  .inv-edit:active{opacity:1;}
  .inv-sim-toggle{display:flex; align-items:center; justify-content:center; gap:5px; margin-top:10px; padding:7px; background:#F5F7F4; border-radius:9px; font-size:11.5px; font-weight:700; color:var(--primary-dark); border:1px dashed var(--line);}
  .inv-sim{margin-top:8px; padding-top:10px; border-top:1px dashed var(--line);}
  .inv-sim-row{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0;}
  .inv-sim-row .l{color:var(--muted);}
  .inv-sim-row .v{font-weight:700;}
  .inv-sim-row .v.gain{color:var(--primary-dark);}
  .inv-progress{height:5px; border-radius:4px; background:var(--line); margin:8px 0 4px; overflow:hidden;}
  .inv-progress .fill{height:100%; background:var(--primary);}
  .inv-progress-lbl{font-size:10px; color:var(--muted); text-align:right;}
  .inv-aportes-toggle{display:flex; align-items:center; justify-content:space-between; margin-top:9px; padding:7px 9px; background:#F5F7F4; border-radius:9px; font-size:11.5px; font-weight:700; color:var(--muted);}
  .inv-aportes-toggle .add-aporte{background:var(--primary); color:#fff; border:none; width:22px; height:22px; border-radius:6px; font-size:14px; display:flex; align-items:center; justify-content:center;}
  .inv-aportes-list{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
  .aporte-row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:5px 0; color:var(--ink);}
  .aporte-row .d{color:var(--muted);}
  .aporte-del{background:none; border:none; color:var(--coral); font-size:14px; opacity:.5; padding:0 4px;}
  .aporte-del:active{opacity:1;}
  .sim-preview{margin-top:2px; padding:11px 12px; background:var(--amber-bg); border-radius:10px; font-size:12.5px; color:var(--ink); line-height:1.5;}
  .sim-preview b{font-family:'Fraunces',serif; font-size:15px; color:var(--primary-dark);}

  /* CICLOS DE PLANEJAMENTO */
  .cycle-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--card); border-radius:var(--radius); padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:14px;}
  .cycle-nav button.arrow{background:#F0F1EE; border:none; color:var(--muted); width:32px; height:32px; border-radius:8px; font-size:16px; display:flex; align-items:center; justify-content:center;}
  .cycle-nav button.arrow:disabled{opacity:.35;}
  .cycle-mid{flex:1; text-align:center;}
  .cycle-name{font-family:'Fraunces',serif; font-weight:600; font-size:15px; text-transform:capitalize;}
  .cycle-status{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; display:inline-block; margin-top:3px;}
  .cycle-status.atual{background:var(--amber-bg); color:var(--amber);}
  .cycle-status.arquivado{background:#EAEDE9; color:var(--muted);}
  .cycle-actions{display:flex; gap:8px; margin-bottom:16px;}
  .cycle-btn{flex:1; padding:11px; border-radius:11px; border:1.5px dashed var(--line); background:none; color:var(--primary-dark); font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;}
  .cycle-list-item{display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-top:1px solid var(--line); font-size:13.5px;}
  .cycle-list-item:first-child{border-top:none;}
  .cycle-list-item .name{font-weight:600; text-transform:capitalize;}
  .cycle-list-item .meta{font-size:11px; color:var(--muted); margin-top:2px;}
  .cycle-list-item .saldo{font-weight:700; white-space:nowrap;}
  .cycle-archived-note{background:var(--amber-bg); color:var(--amber); font-size:12px; padding:9px 12px; border-radius:10px; margin-bottom:14px; text-align:center; font-weight:600;}
</style>
<meta name="theme-color" content="#1F4038">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

// ---- Sincronização em nuvem dos dados de Planejamento (mesma lógica do app Financeiro) ----
const PL_APP_ID = "cicloFinanceiro";
const PL_KEY_PREFIXES = ["painel-bruna-financeiro"];
function plKeyMatches(k){ return PL_KEY_PREFIXES.some(p => k === p || k.indexOf(p) === 0); }
function plCollectLocalSnapshot(){
  const snap = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(plKeyMatches(k)) snap[k] = localStorage.getItem(k);
  }
  return snap;
}
let plPushTimer = null;
function plSchedulePush(){ clearTimeout(plPushTimer); plPushTimer = setTimeout(plPushNow, 900); }
async function plPushNow(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).collection('apps').doc(PL_APP_ID).set(plCollectLocalSnapshot(), {merge:true});
  }catch(e){ console.warn('sync push failed', e); }
}
const plOrigSetItem = Storage.prototype.setItem.bind(localStorage);
const plOrigRemoveItem = Storage.prototype.removeItem.bind(localStorage);
localStorage.setItem = function(k,v){ plOrigSetItem(k,v); if(plKeyMatches(k)) plSchedulePush(); };
localStorage.removeItem = function(k){ plOrigRemoveItem(k); if(plKeyMatches(k)) plSchedulePush(); };
async function plHydrateFromCloud(){
  if(!currentUser) return;
  try{
    const doc = await db.collection('users').doc(currentUser.uid).collection('apps').doc(PL_APP_ID).get();
    if(doc.exists){
      const cloudData = doc.data();
      Object.keys(cloudData).forEach(k=>{ plOrigSetItem(k, cloudData[k]); });
    }
  }catch(e){ console.warn('sync hydrate failed', e); }
}

const FIRST_MONTH = "2026-07";
const JUNE_CLOSING_BALANCE = 6.19;
const PLATFORMS = ["Outlier","OneForma","Telus","Appen","Premise","Clickworker","uTest","Tryber","Customer In Love","Outro"];
const INVEST_TIPOS = ["CDB","Tesouro Direto","LCI/LCA","Poupança","FII","Ações/BDR","Fundo de investimento","Outro"];
const INVEST_PROJETOS_PADRAO = ["Reserva de emergência","Sem projeto vinculado"];
const WEEKDAYS = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

let currentKey = null;
let todayKey = null;
let activeTab = "despesas";
const cache = {};
let investData = null; // { investments:[...], projetos:[...] } — global, não é por mês

async function invLoadData(){
  if(investData) return investData;
  try{
    const snap = await db.collection('users').doc(currentUser.uid).collection('data').doc('investimentos').get();
    const data = snap.exists ? snap.data() : {};
    data.investments = data.investments || [];
    data.projetos = data.projetos && data.projetos.length ? data.projetos : INVEST_PROJETOS_PADRAO.slice();
    investData = data;
    return investData;
  }catch(e){
    investData = {investments:[], projetos: INVEST_PROJETOS_PADRAO.slice()};
    showToast('Sem conexão — mostrando dados locais');
    return investData;
  }
}

async function invSaveData(){
  try{
    await db.collection('users').doc(currentUser.uid).collection('data').doc('investimentos').set(investData);
  }catch(e){
    showToast('Não foi possível salvar na nuvem agora.');
  }
}

function invAportesTotal(inv){
  const aportes = (inv.aportes||[]).reduce((s,a)=>s+(Number(a.valor)||0),0);
  const retiradas = (inv.retiradas||[]).reduce((s,r)=>s+(Number(r.valor)||0),0);
  return aportes - retiradas;
}

function invSimulate(inv){
  const total = invAportesTotal(inv);
  if(!inv.taxaAnual || !inv.vencimento || total<=0) return null;
  const first = (inv.aportes||[]).reduce((min,a)=> !min || a.data<min ? a.data : min, null);
  const start = first ? new Date(first+'T00:00:00') : new Date();
  const now = new Date();
  const venc = new Date(inv.vencimento+'T00:00:00');
  const totalDays = Math.max(1,(venc-start)/86400000);
  const elapsedDays = Math.min(totalDays, Math.max(0,(now-start)/86400000));
  const progressPct = Math.round((elapsedDays/totalDays)*100);
  const anos = Math.max(0,(venc-now)/(86400000*365));
  const projetado = total * Math.pow(1+(Number(inv.taxaAnual)/100), anos);
  const ganho = projetado - total;
  const meses = Math.max(0, Math.round((venc-now)/(86400000*30)));
  return {total, projetado, ganho, progressPct: Math.min(100,progressPct), meses};
}

function pad(n){return String(n).padStart(2,'0');}
function keyOf(y,m){return `${y}-${pad(m)}`;} // m is 1-12
function parseKey(k){const [y,m]=k.split('-').map(Number); return {y,m};}
function prevKey(k){const {y,m}=parseKey(k); return m===1?keyOf(y-1,12):keyOf(y,m-1);}
function nextKey(k){const {y,m}=parseKey(k); return m===12?keyOf(y+1,1):keyOf(y,m+1);}
function keyLessOrEqual(a,b){return a<=b;} // string compare works for YYYY-MM
function daysInMonth(k){const {y,m}=parseKey(k); return new Date(y,m,0).getDate();}
function weekdayOf(k,day){const {y,m}=parseKey(k); return WEEKDAYS[new Date(y,m-1,day).getDay()];}
function monthLabelOf(k){const {y,m}=parseKey(k); return `${MONTHS_PT[m-1]} de ${y}`;}
function fmt(v){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtShort(v){
  const n=Number(v)||0;
  return (n<0?'-':'')+'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function uid(){return Math.random().toString(36).slice(2,9);}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('show'),1600);
}

function defaultData(key){
  const d = { expenses:[], income:[], remoteWork:[], debts:[], manualOpening:null, rates:{usd:5.3,eur:6.1} };
  if(key === FIRST_MONTH) d.manualOpening = JUNE_CLOSING_BALANCE;
  return d;
}

async function loadMonth(key){
  if(cache[key]) return cache[key];
  try{
    const snap = await db.collection('users').doc(currentUser.uid).collection('months').doc(key).get();
    const data = snap.exists ? snap.data() : defaultData(key);
    data.expenses = data.expenses||[]; data.income = data.income||[]; data.remoteWork = data.remoteWork||[];
    data.debts = data.debts||[]; data.rates = data.rates||{usd:5.3,eur:6.1};
    if(data.manualOpening===undefined) data.manualOpening = null;
    cache[key] = data;
    return data;
  }catch(e){
    const data = defaultData(key);
    cache[key] = data;
    showToast('Sem conexão — mostrando dados locais');
    return data;
  }
}

async function saveMonth(key){
  try{
    await db.collection('users').doc(currentUser.uid).collection('months').doc(key).set(cache[key]);
  }catch(e){
    showToast('Não foi possível salvar na nuvem agora.');
  }
}

function sum(arr){return arr.reduce((s,i)=>s+(Number(i.value)||0),0);}

async function closingBalance(key, seen=new Set()){
  if(key < FIRST_MONTH) return 0;
  if(seen.has(key)) return 0; // safety against loops
  seen.add(key);
  const data = await loadMonth(key);
  let opening = 0;
  if(data.manualOpening !== null && data.manualOpening !== undefined){
    opening = Number(data.manualOpening)||0;
  } else if(key === FIRST_MONTH){
    opening = 0;
  } else {
    opening = await closingBalance(prevKey(key), seen);
  }
  const totalExpenses = sum(data.expenses);
  const totalIncome = sum(data.income);
  const totalRemote = remoteTotalBRL(data);
  return opening + totalIncome + totalRemote - totalExpenses;
}

function remoteTotalBRL(data){
  let total = 0;
  data.remoteWork.forEach(r=>{
    const v = Number(r.value)||0;
    if(r.currency==='USD') total += v*(Number(data.rates.usd)||0);
    else if(r.currency==='EUR') total += v*(Number(data.rates.eur)||0);
    else total += v;
  });
  return total;
}

async function render(){
  const ledgerEl = document.querySelector('.ledger');
  const monthNavEl = document.querySelector('.month-nav');
  const fabEl = document.getElementById('fabAdd');
  if(activeTab === 'planejamento'){
    if(ledgerEl) ledgerEl.style.display = 'none';
    if(monthNavEl) monthNavEl.style.display = 'none';
    if(fabEl) fabEl.style.display = 'none';
    renderPlanejamento();
    return;
  }
  if(activeTab === 'investimentos'){
    if(ledgerEl) ledgerEl.style.display = 'none';
    if(monthNavEl) monthNavEl.style.display = 'none';
    if(fabEl) fabEl.style.display = '';
    await renderInvestimentos();
    return;
  }
  if(ledgerEl) ledgerEl.style.display = '';
  if(monthNavEl) monthNavEl.style.display = '';
  if(fabEl) fabEl.style.display = '';
  document.getElementById('monthLabel').textContent = monthLabelOf(currentKey);
  document.getElementById('todayLink').textContent = currentKey===todayKey ? '' : 'toque para voltar a hoje';
  const data = await loadMonth(currentKey);
  const opening = (data.manualOpening!==null && data.manualOpening!==undefined) ? Number(data.manualOpening) : await closingBalance(prevKey(currentKey));
  const totalExpenses = sum(data.expenses);
  const totalIncome = sum(data.income) + remoteTotalBRL(data);
  const final = opening + totalIncome - totalExpenses;
  renderLedger(opening, totalIncome, totalExpenses, final, data);
  renderTabContent(data);
}

function renderLedger(opening, income, expenses, final, data){
  const maxSeg = Math.max(income, expenses, 1);
  const inPct = Math.min(100,(income/maxSeg)*100);
  const outPct = Math.min(100,(expenses/maxSeg)*100);
  document.getElementById('ledgerCard').innerHTML = `
    <div class="ledger-row">
      <div class="ledger-seg"><span class="lbl">Mês anterior</span><span class="val num">${fmtShort(opening)}</span></div>
      <div class="ledger-arrow">→</div>
      <div class="ledger-seg"><span class="lbl">Entradas</span><span class="val num" style="color:var(--primary-dark)">+${fmtShort(income)}</span></div>
      <div class="ledger-seg"><span class="lbl">Saídas</span><span class="val num" style="color:var(--coral)">-${fmtShort(expenses)}</span></div>
    </div>
    <div class="ledger-track"><div class="seg-in" style="width:${inPct/2}%"></div><div class="seg-out" style="width:${outPct/2}%"></div></div>
    <div class="balance-final">
      <div class="lbl">Saldo atual</div>
      <div class="val num ${final>=0?'pos':'neg'}">${fmt(final)}</div>
    </div>
    <div class="opening-edit" id="editOpening">${(data.manualOpening!==null && data.manualOpening!==undefined) ? 'Saldo inicial ajustado manualmente · editar' : 'Ajustar saldo do mês anterior manualmente'}</div>
  `;
  document.getElementById('editOpening').onclick = ()=>openOpeningEditor(data);
}

function openOpeningEditor(data){
  const overlay = document.createElement('div');
  overlay.className='sheet-overlay';
  overlay.innerHTML = `<div class="sheet">
    <h3>Ajustar saldo do mês anterior</h3>
    <div class="field"><label>Valor manual (R$)</label><input type="number" step="0.01" id="opInput" value="${data.manualOpening!==null && data.manualOpening!==undefined ? data.manualOpening : ''}" placeholder="Deixe em branco para calcular automaticamente"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="opCancel">Cancelar</button>
      <button class="btn btn-primary" id="opSave">Salvar</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.remove();});
  document.getElementById('opCancel').onclick=()=>overlay.remove();
  document.getElementById('opSave').onclick=async()=>{
    const v = document.getElementById('opInput').value;
    data.manualOpening = v===''? null : Number(v);
    await saveMonth(currentKey);
    overlay.remove();
    render();
  };
}

function renderTabContent(data){
  const main = document.getElementById('mainContent');
  if(activeTab==='despesas') main.innerHTML = renderDespesas(data);
  else if(activeTab==='receitas') main.innerHTML = renderReceitas(data);
  else if(activeTab==='trabalho') main.innerHTML = renderTrabalho(data);
  else if(activeTab==='dividas') main.innerHTML = renderDividas(data);
  attachDeleteHandlers(data);
}

function renderDespesas(data){
  const total = sum(data.expenses);
  if(data.expenses.length===0){
    return `<div class="section-title"><h2>Despesas</h2><span class="total num">${fmt(0)}</span></div>
    <div class="card"><div class="empty"><b>Nenhuma despesa lançada</b>Toque em + para adicionar o primeiro gasto do mês.</div></div>`;
  }
  const byDay = {};
  data.expenses.forEach(e=>{ (byDay[e.day]=byDay[e.day]||[]).push(e); });
  const days = Object.keys(byDay).map(Number).sort((a,b)=>a-b);
  let html = `<div class="section-title"><h2>Despesas</h2><span class="total num">${fmt(total)}</span></div><div class="card">`;
  days.forEach(day=>{
    const items = byDay[day];
    const dayTotal = sum(items);
    html += `<div class="day-group"><div class="day-head"><span>Dia ${day} · ${weekdayOf(currentKey,day)}</span><span>${fmtShort(dayTotal)}</span></div>`;
    items.forEach(it=>{
      html += `<div class="item-row"><div class="item-desc">${escapeHtml(it.desc||'Sem descrição')}</div><div class="item-value">${fmtShort(it.value)}</div><button class="item-del" data-list="expenses" data-id="${it.id}">×</button></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function renderReceitas(data){
  const remoteTotal = remoteTotalBRL(data);
  const outrasTotal = sum(data.income);
  const total = remoteTotal + outrasTotal;
  let html = `<div class="section-title"><h2>Receitas</h2><span class="total num">${fmt(total)}</span></div><div class="card">`;
  html += `<div class="item-row"><div class="item-desc">Trabalho remoto (total do mês)<span class="plat">calculado na aba Trabalho</span></div><div class="item-value">${fmtShort(remoteTotal)}</div></div>`;
  if(data.income.length===0){
    html += `<div class="empty" style="padding:18px 14px;">Nenhuma outra receita lançada este mês.</div>`;
  } else {
    data.income.forEach(it=>{
      html += `<div class="item-row"><div class="item-desc">${escapeHtml(it.desc||'Sem descrição')}</div><div class="item-value">${fmtShort(it.value)}</div><button class="item-del" data-list="income" data-id="${it.id}">×</button></div>`;

  html += `</div>`;
  return html;

function renderTrabalho(data){
  const total = remoteTotalBRL(data);
  if(data.remoteWork.length===0){
    return `<div class="section-title"><h2>Trabalho remoto</h2><span class="total num">${fmt(0)}</span></div>
    <div class="card"><div class="empty"><b>Nenhum lançamento</b>Adicione seus ganhos por plataforma tocando em +.</div></div>`;
  }
  const byPlatform = {};
  data.remoteWork.forEach(r=>{(byPlatform[r.platform]=byPlatform[r.platform]||[]).push(r);});
  let html = `<div class="section-title"><h2>Trabalho remoto</h2><span class="total num">${fmt(total)}</span></div>`;
  Object.keys(byPlatform).sort().forEach(plat=>{
    const items = byPlatform[plat];
    let platTotalBRL = 0;
    items.forEach(r=>{
      const v=Number(r.value)||0;
      platTotalBRL += r.currency==='USD'? v*(data.rates.usd||0) : r.currency==='EUR'? v*(data.rates.eur||0) : v;
    });
    html += `<div class="section-title" style="margin-top:14px;"><h2 style="font-size:14px;">${escapeHtml(plat)}</h2><span class="total num">${fmtShort(platTotalBRL)}</span></div><div class="card">`;
    items.forEach(it=>{
      const symbol = it.currency==='USD'?'US$':it.currency==='EUR'?'€':'R$';
      html += `<div class="item-row"><div class="item-desc">${it.desc?escapeHtml(it.desc):'Lançamento do mês'}</div><div class="item-value">${symbol} ${Number(it.value).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><button class="item-del" data-list="remoteWork" data-id="${it.id}">×</button></div>`;
    });
    html += `</div>`;
  });
  html += `<div class="section-title" style="margin-top:16px;"><h2 style="font-size:13px;color:var(--muted);">Cotações usadas</h2></div>
  <div class="card"><div class="item-row"><div class="item-desc">Dólar (USD → BRL)</div><input type="number" step="0.01" value="${data.rates.usd}" style="width:80px;text-align:right;border:1.5px solid var(--line);border-radius:8px;padding:6px;" id="rateUsd"></div>
  <div class="item-row"><div class="item-desc">Euro (EUR → BRL)</div><input type="number" step="0.01" value="${data.rates.eur}" style="width:80px;text-align:right;border:1.5px solid var(--line);border-radius:8px;padding:6px;" id="rateEur"></div></div>`;
  return html;
}

function renderDividas(data){
  if(data.debts.length===0){
    return `<div class="section-title"><h2>Dívidas &amp; cofrinho</h2></div>
    <div class="card"><div class="empty"><b>Nada por aqui</b>Registre valores que você deve ou que devem a você.</div></div>`;
  }
  let html = `<div class="section-title"><h2>Dívidas &amp; cofrinho</h2></div><div class="card">`;
  data.debts.forEach(d=>{
    html += `<div class="item-row"><div class="item-desc">${escapeHtml(d.desc||'Sem descrição')}${d.date?`<span class="plat">${d.date}</span>`:''}</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="status-pill ${d.paid?'pago':'pendente'}" data-toggle-debt="${d.id}">${d.paid?'Pago':'Pendente'}</span>
      <div class="item-value">${fmtShort(d.value)}</div>
    </div>
    <button class="item-del" data-list="debts" data-id="${d.id}">×</button></div>`;
  });
  html += `</div>`;
  return html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachDeleteHandlers(data){
  document.querySelectorAll('.item-del').forEach(btn=>{
    btn.onclick = async ()=>{
      const list = btn.dataset.list, id = btn.dataset.id;
      data[list] = data[list].filter(i=>i.id!==id);
      await saveMonth(currentKey);
      render();
    };
  });
  document.querySelectorAll('[data-toggle-debt]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.toggleDebt;
      const d = data.debts.find(x=>x.id===id);

      await saveMonth(currentKey);
      render();

  if(re) re.onchange = async()=>{ data.rates.eur = Number(re.value)||0; await saveMonth(currentKey); render(); };
}

// ---- PLANEJAMENTO (ciclo financeiro, com suporte a múltiplos ciclos) ----
const PL_STORAGE_KEY = 'painel-bruna-financeiro-ago2026'; // chave antiga (formato único) — usada só para migração
const PL_INDEX_KEY = 'painel-bruna-financeiro-ciclos-index';
const PL_CYCLE_PREFIX = 'painel-bruna-financeiro-ciclo-';

function plFmt(v){
  return 'R$ ' + (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function plDefaultData() {
  return {
    recebimento: 0,
    reserva: 0,
    fixos: [],
    variaveis: [],
    dividas: [],
    archived: false,
    archivedAt: null
  };
}

// ---- armazenamento por ciclo (mês) ----
function plCycleStorageKey(monthKey){ return PL_CYCLE_PREFIX + monthKey; }

function plGetIndex(){
  try{
    const raw = localStorage.getItem(PL_INDEX_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function plSaveIndex(arr){
  try{ localStorage.setItem(PL_INDEX_KEY, JSON.stringify(arr)); }
  catch(e){ console.warn('Não foi possível salvar o índice de ciclos:', e); }
}

function plLoadCycle(monthKey){
  try{
    const raw = localStorage.getItem(plCycleStorageKey(monthKey));
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('Armazenamento local indisponível:', e); }
  return null;
}
function plSaveCycleData(monthKey, data){
  try{ localStorage.setItem(plCycleStorageKey(monthKey), JSON.stringify(data)); }
  catch(e){ console.warn('Não foi possível salvar o planejamento:', e); }
}

// cria o(s) ciclo(s) inicial(is), migrando o formato antigo (chave única) se existir
function plEnsureInitialized(){
  let index = plGetIndex();
  if(index.length === 0){
    let migrated = null;
    try{
      const old = localStorage.getItem(PL_STORAGE_KEY);
      if(old) migrated = JSON.parse(old);
    }catch(e){}
    const monthKey = migrated ? '2026-08' : todayKey; // o ciclo antigo corresponde a agosto/2026
    const data = migrated || plDefaultData();
    if(data.archived === undefined) data.archived = false;
    if(data.archivedAt === undefined) data.archivedAt = null;
    plSaveCycleData(monthKey, data);
    index = [monthKey];
    plSaveIndex(index);
  }
  return index;
}

function plCycleLabel(monthKey){
  const {m} = parseKey(monthKey);
  const last = daysInMonth(monthKey);
  return `${MONTHS_PT[m-1]} (01 a ${pad(last)}/${pad(m)})`;
}

function plComputeSaldo(data){
  const disponivel = (parseFloat(data.recebimento)||0) - (parseFloat(data.reserva)||0);
  const totalFixos = plSum(data.fixos||[]);
  const totalVariaveis = plSum(data.variaveis||[]);
  const totalDividas = plSum((data.dividas||[]).filter(d=>d.marcado));
  return disponivel - totalFixos - totalVariaveis - totalDividas;
}

let plData = null;
let plViewKey = null; // qual ciclo (mês) está sendo exibido

function plStatusLabel(status){
  if(status === 'negativada') return '<span class="pl-debt-status pl-status-negativada">negativada</span>';
  if(status === 'negociar') return '<span class="pl-debt-status pl-status-negociar">negociar</span>';
  return '<span class="pl-debt-status pl-status-atrasada">atrasada</span>';
}

function plRenderList(containerId, key){
  const container = document.getElementById(containerId);
  if(!container) return;
  const ro = !!plData.archived;
  container.innerHTML = '';
  plData[key].forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'pl-row';
    row.innerHTML = `
      <div class="pl-label"><input type="text" value="${item.nome}" data-key="${key}" data-idx="${i}" data-field="nome" ${ro?'disabled':''}></div>
      <input type="number" value="${item.valor}" step="0.01" data-key="${key}" data-idx="${i}" data-field="valor" ${ro?'disabled':''}>
      ${ro?'':`<button class="pl-del" data-key="${key}" data-idx="${i}" title="remover">✕</button>`}
    `;
    container.appendChild(row);
  });
}

function plRenderDebts(){
  const container = document.getElementById('pl-dividas-list');
  if(!container) return;
  const ro = !!plData.archived;
  container.innerHTML = '';
  plData.dividas.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'pl-debt-row';
    row.innerHTML = `
      <input type="checkbox" ${item.marcado ? 'checked' : ''} data-idx="${i}" data-field="marcado" ${ro?'disabled':''}>
      <div class="pl-debt-name">
        <input type="text" value="${item.nome}" data-idx="${i}" data-field="nome" style="border:none;background:transparent;font-family:'Inter',sans-serif;font-size:13.5px;width:100%;" ${ro?'disabled':''}>
        ${plStatusLabel(item.status)}
      </div>
      <input type="number" value="${item.valor}" step="0.01" data-idx="${i}" data-field="valor" ${ro?'disabled':''}>
      ${ro?'':`<button class="pl-del" data-idx="${i}" title="remover">✕</button>`}
    `;
    container.appendChild(row);
  });
}

function plSum(arr){ return arr.reduce((s, x) => s + (parseFloat(x.valor) || 0), 0); }

function plRecalc(){
  const recebimento = parseFloat(plData.recebimento) || 0;
  const reserva = parseFloat(plData.reserva) || 0;
  const disponivel = recebimento - reserva;

  const totalFixos = plSum(plData.fixos);
  const totalVariaveis = plSum(plData.variaveis);
  const totalDividas = plSum(plData.dividas.filter(d => d.marcado));

  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  set('pl-disponivel', plFmt(disponivel));
  set('pl-total-fixos', plFmt(totalFixos));
  set('pl-total-variaveis', plFmt(totalVariaveis));
  set('pl-total-dividas', plFmt(totalDividas));
  set('pl-s-disponivel', plFmt(disponivel));
  set('pl-s-fixos', plFmt(totalFixos));
  set('pl-s-variaveis', plFmt(totalVariaveis));
  set('pl-s-dividas', plFmt(totalDividas));

  const saldo = disponivel - totalFixos - totalVariaveis - totalDividas;
  const saldoEl = document.getElementById('pl-saldo-final');
  if(saldoEl){
    saldoEl.textContent = plFmt(saldo);
    saldoEl.className = 'val ' + (saldo >= 0 ? 'positive' : 'negative');
  }
}

function plRenderAll(){
  const recEl = document.getElementById('pl-recebimento');
  const resEl = document.getElementById('pl-reserva');
  if(recEl) recEl.value = plData.recebimento;
  if(resEl) resEl.value = plData.reserva;
  plRenderList('pl-fixos-list', 'fixos');
  plRenderList('pl-variaveis-list', 'variaveis');
  plRenderDebts();
  plRecalc();
}

function plAddRow(key){
  if(plData.archived) return;
  plData[key].push({nome: 'Novo item', valor: 0});
  plSaveCycleData(plViewKey, plData);
  plRenderAll();
}

function plAddDebtRow(){
  if(plData.archived) return;
  plData.dividas.push({nome: 'Nova dívida', valor: 0, status: 'atrasada', marcado: false});
  plSaveCycleData(plViewKey, plData);
  plRenderAll();
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if(!t.closest('#page-planejamento-root') || !plData || plData.archived) return;
  if(t.id === 'pl-recebimento'){ plData.recebimento = parseFloat(t.value) || 0; plSaveCycleData(plViewKey, plData); plRecalc(); return; }
  if(t.id === 'pl-reserva'){ plData.reserva = parseFloat(t.value) || 0; plSaveCycleData(plViewKey, plData); plRecalc(); return; }

  const key = t.getAttribute('data-key');
  const idx = t.getAttribute('data-idx');
  const field = t.getAttribute('data-field');
  if(idx === null || field === null) return;

  const targetArr = key ? plData[key] : plData.dividas;
  if(!targetArr || !targetArr[idx]) return;

  if(field === 'valor') targetArr[idx].valor = parseFloat(t.value) || 0;
  else if(field === 'nome') targetArr[idx].nome = t.value;
  else if(field === 'marcado') targetArr[idx].marcado = t.checked;

  plSaveCycleData(plViewKey, plData);
  plRecalc();
});

document.addEventListener('click', (e) => {
  if(!e.target.classList.contains('pl-del')) return;
  if(!plData || plData.archived) return;
  const key = e.target.getAttribute('data-key');
  const idx = parseInt(e.target.getAttribute('data-idx'), 10);
  const targetArr = key ? plData[key] : plData.dividas;
  targetArr.splice(idx, 1);
  plSaveCycleData(plViewKey, plData);
  plRenderAll();
});

// ---- navegação entre ciclos ----
function plNavigate(dir){
  const index = plGetIndex();
  const pos = index.indexOf(plViewKey);
  const newPos = pos + dir;
  if(newPos < 0 || newPos >= index.length) return;
  plViewKey = index[newPos];
  renderPlanejamento();
}

function plGoToCycle(monthKey){
  plViewKey = monthKey;
  renderPlanejamento();
}

function plConfirmArchive(){
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `<div class="sheet">
    <h3>Arquivar este ciclo?</h3>
    <div class="sheet-sub" style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">
      Depois de arquivado, o ciclo <b>${plCycleLabel(plViewKey)}</b> fica travado — você poderá consultar, mas não editar mais.
      Os gastos fixos serão copiados automaticamente para o próximo ciclo.
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="plArchCancel">Cancelar</button>
      <button class="btn btn-primary" id="plArchConfirm">Arquivar e continuar</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('plArchCancel').onclick = ()=>overlay.remove();
  document.getElementById('plArchConfirm').onclick = ()=>{ overlay.remove(); plDoArchive(); };
}

function plDoArchive(){
  plData.archived = true;
  plData.archivedAt = new Date().toISOString();
  plSaveCycleData(plViewKey, plData);

  const newMonthKey = nextKey(plViewKey);
  let newData = plLoadCycle(newMonthKey);
  if(!newData){
    newData = plDefaultData();
    newData.fixos = (plData.fixos||[]).map(f=>({nome:f.nome, valor:f.valor}));
    plSaveCycleData(newMonthKey, newData);
  }
  const index = plGetIndex();
  if(!index.includes(newMonthKey)){ index.push(newMonthKey); plSaveIndex(index); }
  plViewKey = newMonthKey;
  showToast('Ciclo arquivado! Começando ' + plCycleLabel(newMonthKey) + '.');
  renderPlanejamento();
}

function renderPlanejamento(){
  const main = document.getElementById('mainContent');
  const index = plEnsureInitialized();
  if(!plViewKey || !index.includes(plViewKey)) plViewKey = index[index.length-1];
  plData = plLoadCycle(plViewKey) || plDefaultData();

  const pos = index.indexOf(plViewKey);
  const isArchived = !!plData.archived;

  const archivedCycles = index
    .filter(k => k !== plViewKey)
    .map(k => ({key:k, data: plLoadCycle(k) || plDefaultData()}))
    .filter(c => c.data.archived)

// ---- INVESTIMENTOS ----
function renderInvestimentos(){
  return invLoadData().then(data=>{
    const main = document.getElementById('mainContent');
    const totalInvestido = data.investments.reduce((s,inv)=>s+invAportesTotal(inv),0);
    let projetado = 0, temSimulacao = false;
    data.investments.forEach(inv=>{
      const sim = invSimulate(inv);
      if(sim){ projetado += sim.projetado; temSimulacao = true; } else { projetado += invAportesTotal(inv); }
    });
    const ganhoTotal = projetado - totalInvestido;
    const instituicoes = new Set(data.investments.map(i=>i.instituicao).filter(Boolean));
    const projetosVinculados = new Set(data.investments.map(i=>i.projeto).filter(p=>p && p!=='Sem projeto vinculado'));

    let html = `<div class="inv-summary">
      <div class="inv-summary-row"><div>
        <div class="lbl">Total investido</div>
        <div class="val num">${fmt(totalInvestido)}</div>
      </div></div>
      <div class="inv-summary-split">
        <div class="item"><div class="n num">${data.investments.length}</div><div class="l">investimentos</div></div>
        <div class="item"><div class="n num">${projetosVinculados.size}</div><div class="l">projetos vinculados</div></div>
        <div class="item"><div class="n num">${instituicoes.size}</div><div class="l">instituições</div></div>
      </div>`;
    if(temSimulacao){
      html += `<div class="inv-summary-row" style="margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);"><div>
        <div class="lbl">Patrimônio projetado (nos vencimentos)</div>
        <div class="val num" style="color:var(--amber); font-size:20px;">${fmt(projetado)}</div>
        <div class="sub">${ganhoTotal>=0?'+ ':''}${fmt(ganhoTotal)} de rendimento estimado</div>
      </div></div>`;
    }
    html += `</div>`;

    if(data.investments.length===0){
      html += `<div class="section-title"><h2>Seus investimentos</h2></div>
      <div class="card"><div class="empty"><b>Nenhum investimento cadastrado</b>Toque em + para registrar seu primeiro aporte.</div></div>`;
    } else {
      html += `<div class="section-title"><h2>Seus investimentos</h2><span class="total num">${fmt(totalInvestido)}</span></div><div class="card">`;
      data.investments.forEach(inv=>{
        const total = invAportesTotal(inv);
        const sim = invSimulate(inv);
        const historico = [
          ...(inv.aportes||[]).map(a=>({...a, tipo:'aporte'})),
          ...(inv.retiradas||[]).map(r=>({...r, tipo:'retirada'}))
        ].sort((a,b)=>b.data.localeCompare(a.data));
        html += `<div class="inv-row" data-inv-id="${inv.id}">
          <div style="position:absolute; top:12px; right:12px; display:flex; gap:4px;">
            <button class="inv-edit" data-edit-inv="${inv.id}" title="editar">✎</button>
            <button class="inv-del" data-del-inv="${inv.id}" title="excluir" style="position:static;">×</button>
          </div>
          <div class="inv-top">
            <div>
              <div class="inv-name">${escapeHtml(inv.produto||'Sem nome')}</div>
              <div class="inv-broker">${escapeHtml(inv.instituicao||'')}</div>
            </div>
            <div class="inv-value num">${fmt(total)}</div>
          </div>
          <div class="inv-tags">
            ${inv.taxaLabel ? `<span class="tag tag-rate">${escapeHtml(inv.taxaLabel)}</span>` : ''}
            ${inv.vencimento ? `<span class="tag tag-term">Vence ${fmtDateBR(inv.vencimento)}</span>` : ''}
            ${inv.projeto && inv.projeto!=='Sem projeto vinculado' ? `<span class="tag tag-project">🎯 ${escapeHtml(inv.projeto)}</span>` : ''}
          </div>
          ${inv.obs ? `<div class="inv-note">${escapeHtml(inv.obs)}</div>` : ''}
          ${sim ? `
          <div class="inv-sim-toggle" data-toggle-sim="${inv.id}">📊 Ver simulação de rendimento</div>
          <div class="inv-sim" id="sim-${inv.id}" style="display:none;">
            <div class="inv-sim-row"><span class="l">Valor estimado no vencimento</span><span class="v num">${fmt(sim.projetado)}</span></div>
            <div class="inv-sim-row"><span class="l">Rendimento estimado</span><span class="v gain num">${sim.ganho>=0?'+ ':''}${fmt(sim.ganho)}</span></div>
            <div class="inv-progress"><div class="fill" style="width:${sim.progressPct}%"></div></div>
            <div class="inv-progress-lbl">${sim.progressPct}% do prazo decorrido${sim.meses>0?` · faltam ~${sim.meses} meses`:''}</div>
          </div>` : ''}
          <div class="inv-aportes-toggle" data-toggle-aportes="${inv.id}">
            <span>📜 ${historico.length} movimentação(ões) · total ${fmtShort(total)}</span>
            <div style="display:flex; gap:6px;">
              <button class="add-aporte" data-withdraw="${inv.id}" title="retirar valor" style="background:var(--coral);">−</button>
              <button class="add-aporte" data-add-aporte="${inv.id}" title="adicionar aporte">+</button>
            </div>
          </div>
          <div class="inv-aportes-list" id="aportes-${inv.id}" style="display:none;">
            ${historico.map(h=>`
              <div class="aporte-row"><span class="d">${fmtDateBR(h.data)}${h.tipo==='retirada'?' · retirada':''}</span><span style="${h.tipo==='retirada'?'color:var(--coral);':''}">${h.tipo==='retirada'?'− ':'+ '}${fmtShort(h.valor)}</span><button class="aporte-del" data-del-mov="${inv.id}|${h.tipo}|${h.id}">×</button></div>
            `).join('')}
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    main.innerHTML = html;
    attachInvestHandlers(data);
  });
}

function fmtDateBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function attachInvestHandlers(data){
  document.querySelectorAll('[data-toggle-sim]').forEach(el=>{
    el.onclick = ()=>{
      const box = document.getElementById('sim-'+el.dataset.toggleSim);
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    };
  });
  document.querySelectorAll('[data-toggle-aportes]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-add-aporte]') || e.target.closest('[data-withdraw]')) return;
      const box = document.getElementById('aportes-'+el.dataset.toggleAportes);
      box.style.display = box.style.display==='none' ? 'block' : 'none';
    };
  });
  document.querySelectorAll('[data-add-aporte]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openAddAporteSheet(el.dataset.addAporte, data); };
  });
  document.querySelectorAll('[data-withdraw]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openWithdrawSheet(el.dataset.withdraw, data); };
  });
  document.querySelectorAll('[data-edit-inv]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openAddInvestmentSheet(el.dataset.editInv); };
  });
  document.querySelectorAll('[data-del-inv]').forEach(el=>{
    el.onclick = async ()=>{
      data.investments = data.investments.filter(i=>i.id!==el.dataset.delInv);
      await invSaveData();
      renderInvestimentos();
    };
  });
  document.querySelectorAll('[data-del-mov]').forEach(el=>{
    el.onclick = async ()=>{
      const [invId, tipo, movId] = el.dataset.delMov.split('|');
      const inv = data.investments.find(i=>i.id===invId);
      if(inv){
        if(tipo==='retirada') inv.retiradas = (inv.retiradas||[]).filter(r=>r.id!==movId);
        else inv.aportes = (inv.aportes||[]).filter(a=>a.id!==movId);
      }
      await invSaveData();
      renderInvestimentos();
    };
  });
}

function openAddInvestmentSheet(editId){
  invLoadData().then(data=>{
    const editing = editId ? data.investments.find(i=>i.id===editId) : null;
    const overlay = document.createElement('div');
    overlay.className='sheet-overlay';
    const projetoOptions = data.projetos.map(p=>`<option value="${escapeHtml(p)}" ${editing&&editing.projeto===p?'selected':''}>${escapeHtml(p)}</option>`).join('');
    overlay.innerHTML = `<div class="sheet">
      <h3>${editing ? 'Editar investimento' : 'Novo investimento'}</h3>
      <div class="field"><label>Instituição (corretora/banco)</label><input type="text" id="iInstituicao" placeholder="Ex: Nubank, XP, Banco Inter..." value="${editing?escapeHtml(editing.instituicao||''):''}"></div>
      <div class="field"><label>Nome do produto</label><input type="text" id="iProduto" placeholder="Ex: CDB Liquidez Diária" value="${editing?escapeHtml(editing.produto||''):''}"></div>
      ${editing ? '' : `<div class="row2">
        <div class="field"><label>Valor do primeiro aporte (R$)</label><input type="number" step="0.01" id="iValor" placeholder="0,00"></div>
        <div class="field"><label>Data do aporte</label><input type="date" id="iData" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>`}
      <div class="row2">
        <div class="field"><label>Taxa (rótulo)</label><input type="text" id="iTaxaLabel" placeholder="Ex: 110% do CDI, 12% a.a." value="${editing?escapeHtml(editing.taxaLabel||''):''}"></div>
        <div class="field"><label>Taxa anual p/ simulação (%)</label><input type="number" step="0.01" id="iTaxaAnual" placeholder="Ex: 12.5" value="${editing&&editing.taxaAnual?editing.taxaAnual:''}"></div>
      </div>
      <div class="field"><label>Vencimento (opcional, p/ simular rendimento)</label><input type="date" id="iVencimento" value="${editing&&editing.vencimento?editing.vencimento:''}"></div>
      <div class="field"><label>Tipo</label><select id="iTipo">${INVEST_TIPOS.map(t=>`<option ${editing&&editing.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Vincular a um projeto/meta</label>
        <select id="iProjeto">${projetoOptions}<option value="__novo__">+ Criar novo projeto...</option></select>
      </div>
      <div id="iNovoProjetoWrap" class="field" style="display:none;"><label>Nome do novo projeto</label><input type="text" id="iNovoProjeto"></div>
      <div class="field"><label>Observações (opcional)</label><input type="text" id="iObs" placeholder="Ex: isento de IR, resgate automático..." value="${editing?escapeHtml(editing.obs||''):''}"></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="iCancel">Cancelar</button>
        <button class="btn btn-primary" id="iSave">${editing ? 'Salvar alterações' : 'Salvar investimento'}</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.remove();});
    document.getElementById('iCancel').onclick=()=>overlay.remove();
    const projSel = document.getElementById('iProjeto');
    projSel.onchange = ()=>{ document.getElementById('iNovoProjetoWrap').style.display = projSel.value==='__novo__' ? 'block' : 'none'; };

    document.getElementById('iSave').onclick = async ()=>{
      const produto = document.getElementById('iProduto').value.trim();
      if(!produto){ showToast('Informe o nome do produto'); return; }
      let valor;
      if(!editing){
        valor = Number(document.getElementById('iValor').value);
        if(!valor || valor<=0){ showToast('Informe um valor válido'); return; }
      }
      let projeto = projSel.value;
      if(projeto==='__novo__'){
        const novo = document.getElementById('iNovoProjeto').value.trim();
        if(!novo){ showToast('Informe o nome do projeto'); return; }
        if(!data.projetos.includes(novo)) data.projetos.push(novo);
        projeto = novo;
      }
      const campos = {
        instituicao: document.getElementById('iInstituicao').value.trim(),
        produto,
        tipo: document.getElementById('iTipo').value,
        taxaLabel: document.getElementById('iTaxaLabel').value.trim(),
        taxaAnual: Number(document.getElementById('iTaxaAnual').value) || null,
        vencimento: document.getElementById('iVencimento').value || null,
        projeto,
        obs: document.getElementById('iObs').value.trim()
      };
      if(editing){
        Object.assign(editing, campos);
      } else {
        data.investments.push({
          id: uid(),
          ...campos,
          aportes: [{id:uid(), data: document.getElementById('iData').value || new Date().toISOString().slice(0,10), valor}],
          retiradas: []
        });
      }
      await invSaveData();
      overlay.remove();
      showToast(editing ? 'Investimento atualizado!' : 'Investimento adicionado!');
      renderInvestimentos();
    };
  });
}

function openAddAporteSheet(invId, data){

    <h3>Novo aporte</h3>
    <div class="sheet-sub" style="font-size:12px;color:var(--muted);margin-bottom:14px;">${escapeHtml(inv.produto)} · ${escapeHtml(inv.instituicao||'')}</div>

      <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="aValor" placeholder="0,00"></div>

function openWithdrawSheet(invId, data){
  const inv = data.investments.find(i=>i.id===invId);
  if(!inv) return;
  const saldoAtual = invAportesTotal(inv);
  const overlay = document.createElement('div');
  overlay.className='sheet-overlay';
  overlay.innerHTML = `<div class="sheet">
    <h3>Retirar valor</h3>
    <div class="sheet-sub" style="font-size:12px;color:var(--muted);margin-bottom:14px;">${escapeHtml(inv.produto)} · ${escapeHtml(inv.instituicao||'')} · saldo atual: ${fmt(saldoAtual)}</div>
    <div class="row2">
      <div class="field"><label>Valor a retirar (R$)</label><input type="number" step="0.01" id="wValor" placeholder="0,00"></div>
      <div class="field"><label>Data</label><input type="date" id="wData" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>
    <div class="field"><label>Motivo (opcional)</label><input type="text" id="wMotivo" placeholder="Ex: resgate parcial, emergência..."></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="wCancel">Cancelar</button>
      <button class="btn btn-primary" id="wSave" style="background:var(--coral);">Confirmar retirada</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.remove();});
  document.getElementById('wCancel').onclick=()=>overlay.remove();
  document.getElementById('wSave').onclick = async ()=>{
    const valor = Number(document.getElementById('wValor').value);
    if(!valor || valor<=0){ showToast('Informe um valor válido'); return; }
    if(valor > saldoAtual){ showToast('Valor maior que o saldo disponível nesse investimento'); return; }
    inv.retiradas = inv.retiradas || [];
    inv.retiradas.push({id:uid(), data: document.getElementById('wData').value || new Date().toISOString().slice(0,10), valor, motivo: document.getElementById('wMotivo').value.trim()});
    await invSaveData();
    overlay.remove();
    showToast('Retirada registrada!');
    renderInvestimentos();
  };
}

// ---- AUTH ----
let currentUser = null;
let authMode = 'login';

function setAuthTab(mode){
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('on', mode==='login');
  document.getElementById('tabSignup').classList.toggle('on', mode==='signup');
  document.getElementById('authSubmit').textContent = mode==='login' ? 'Entrar' : 'Criar conta';
  document.getElementById('authError').classList.remove('show');
}
document.getElementById('tabLogin').onclick = ()=>setAuthTab('login');
document.getElementById('tabSignup').onclick = ()=>setAuthTab('signup');

function authErrorMsg(code){
  const map = {
    'auth/invalid-email':'E-mail inválido.',
    'auth/user-not-found':'Não existe conta com esse e-mail.',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Toque em "Entrar".',
    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/network-request-failed':'Sem conexão com a internet.'
  };
  return map[code] || ('Não foi possível continuar (código: ' + (code||'desconhecido') + ').');
}

document.getElementById('authSubmit').onclick = async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const errEl = document.getElementById('authError');
  errEl.classList.remove('show');
  if(!email || !pass){ errEl.textContent='Preencha e-mail e senha.'; errEl.classList.add('show'); return; }
  try{
    if(authMode==='signup') await auth.createUserWithEmailAndPassword(email, pass);
    else await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    errEl.textContent = authErrorMsg(e.code);
    errEl.classList.add('show');
  }
};

document.getElementById('logoutBtn').onclick = ()=>{ auth.signOut(); };

function showApp(){ document.getElementById('authOverlay').style.display='none'; }
function showAuth(){ document.getElementById('authOverlay').style.display='flex'; }

auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser = user;
    Object.keys(cache).forEach(k=>delete cache[k]); // limpa cache de sessão anterior
    investData = null; // limpa cache de investimentos da sessão anterior
    await plHydrateFromCloud();
    showApp();
    const now = new Date();
    todayKey = keyOf(now.getFullYear(), now.getMonth()+1);
    currentKey = keyLessOrEqual(FIRST_MONTH, todayKey) ? todayKey : FIRST_MONTH;
    await goTo(currentKey);
  } else {
    currentUser = null;
    showAuth();
  }
});

</script>
